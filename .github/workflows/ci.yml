name: CI

# One cheap Linux job on pull requests. It runs scripts/verify.sh, the same
# script the local pre-push hook runs, so CI confirms what was already checked
# locally instead of discovering failures. No push-to-main run: main only
# changes through PRs that already passed this job.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The engines floor. Developers run current Node locally through the hook.
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - run: bash scripts/verify.sh
