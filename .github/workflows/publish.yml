name: Publish CLI

# Release flow: bump packages/cli/package.json + CHANGELOG in a PR, merge,
# then push a tag `cli-vX.Y.Z` on that commit. This workflow never edits the
# version; it fails if the tag and package.json disagree.
#
# npm auth uses Trusted Publishing (OIDC, no long-lived token). The trusted
# publisher must be configured on npmjs.com for @moltbotden/cli with:
#   repository: moltbot-den/moltbotden-dev-tools
#   workflow:   publish.yml
#   environment: release
# There is no npm token: publishing only works through that trusted publisher.
#
# After npm, the standalone binaries are built and smoke-tested on every
# target (binaries.yml), attached to the GitHub release with SHA256SUMS
# (scripts/install.sh and install.ps1 download them), and the Homebrew
# formula in moltbot-den/homebrew-tap is updated (deploy key secret
# HOMEBREW_TAP_DEPLOY_KEY). Prereleases do not touch the tap.
#
# workflow_dispatch is a dry run: it builds and smoke-tests every binary and
# assembles the release assets and formula, but publishes nothing.

on:
  push:
    tags:
      - 'cli-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance + trusted publishing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match packages/cli/package.json version $PKG_VERSION. Bump the version in a PR first; CI never rewrites it."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' packages/cli/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::packages/cli/CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11
        # Pinned to a major so releases use a known npm line; bump deliberately.

      - name: Publish to npm
        run: |
          # npm >= 11.5.1 authenticates with the job's OIDC token (trusted publishing).
          npm --version
          npm publish -w packages/cli --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A semver prerelease (3.1.0-beta.1) must not become "latest": the
          # install scripts download from releases/latest.
          PRERELEASE=()
          case "$VERSION" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "@moltbotden/cli $VERSION" \
            --notes-file release-notes.md \
            --verify-tag "${PRERELEASE[@]}"

  binaries:
    # Runs after a successful npm publish, or alone for a dry run.
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    uses: ./.github/workflows/binaries.yml

  release-assets:
    needs: [publish, binaries]
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: mbd-*
          path: dist-bin
          merge-multiple: true

      - name: Checksums
        working-directory: dist-bin
        run: |
          sha256sum mbd-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5

      - name: Render Homebrew formula
        env:
          VERSION: ${{ needs.publish.outputs.version || '0.0.0-dryrun' }}
        run: |
          node scripts/render-formula.mjs "$VERSION" dist-bin/SHA256SUMS > mbd.rb
          ruby -c mbd.rb
          cat mbd.rb

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist-bin/*
            mbd.rb
          retention-days: 7

      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-bin/* --clobber

  homebrew:
    needs: [publish, release-assets]
    if: ${{ github.event_name == 'push' && !contains(needs.publish.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      - uses: actions/checkout@v7
        with:
          repository: moltbot-den/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit the formula
        working-directory: tap
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p Formula
          cp ../assets/mbd.rb Formula/mbd.rb
          git add Formula/mbd.rb
          if git diff --cached --quiet; then
            echo "Formula already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "mbd $VERSION"
          git push

  verify-homebrew:
    # Install the just-published formula the way users do, on both OSes.
    needs: [publish, homebrew]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: brew install moltbot-den/tap/mbd
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install moltbot-den/tap/mbd
          brew test moltbot-den/tap/mbd
          test "$(mbd --version)" = "$VERSION"
          mbd api /health --jq .status
