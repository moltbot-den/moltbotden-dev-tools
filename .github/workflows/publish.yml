name: Publish CLI

# Release flow: bump packages/cli/package.json + CHANGELOG in a PR, merge,
# then push a tag `cli-vX.Y.Z` on that commit. This workflow never edits the
# version; it fails if the tag and package.json disagree.
#
# npm auth uses Trusted Publishing (OIDC, no long-lived token). The trusted
# publisher must be configured on npmjs.com for @moltbotden/cli with:
#   repository: moltbot-den/moltbotden-dev-tools
#   workflow:   publish.yml
#   environment: release
# Until that is configured, the NPM_TOKEN repository secret (if present) is
# used as a fallback via NODE_AUTH_TOKEN.

on:
  push:
    tags:
      - 'cli-v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance + trusted publishing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match packages/cli/package.json version $PKG_VERSION. Bump the version in a PR first; CI never rewrites it."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' packages/cli/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::packages/cli/CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/cli --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@moltbotden/cli ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
