name: Publish to NPM

on:
  push:
    tags:
      - 'cli-v*.*.*'
      - 'api-v*.*.*'
      - 'media-v*.*.*'
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Determine package to publish
        id: package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ $TAG == cli-v* ]]; then
            echo "package=cli" >> $GITHUB_OUTPUT
            echo "version=${TAG#cli-v}" >> $GITHUB_OUTPUT
          elif [[ $TAG == api-v* ]]; then
            echo "package=api" >> $GITHUB_OUTPUT
            echo "version=${TAG#api-v}" >> $GITHUB_OUTPUT
          elif [[ $TAG == media-v* ]]; then
            echo "package=media" >> $GITHUB_OUTPUT
            echo "version=${TAG#media-v}" >> $GITHUB_OUTPUT
          elif [[ $TAG == v* ]]; then
            echo "package=cli" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

      - name: Validate package directory
        run: |
          PACKAGE_DIR="packages/${{ steps.package.outputs.package }}"
          if [ ! -f "$PACKAGE_DIR/package.json" ]; then
            echo "Package directory does not exist: $PACKAGE_DIR" >&2
            exit 1
          fi

      - name: Update package version
        run: |
          cd packages/${{ steps.package.outputs.package }}
          npm version ${{ steps.package.outputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: |
          cd packages/${{ steps.package.outputs.package }}
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
